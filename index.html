<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <h1 class="card__title">Main Menu</h1>
    <p class="card__subtitle">Choose an option to continue</p>

    <!-- Menu options -->
    <div class="menu" id="menu">
      <div class="menu__item" data-choice="1">
        <div class="menu__num">1</div>
        <div class="menu__text">
          <div class="menu__label">Register</div>
          <div class="menu__desc">Create a new account</div>
        </div>
      </div>

      <div class="menu__item" data-choice="2">
        <div class="menu__num">2</div>
        <div class="menu__text">
          <div class="menu__label">Login</div>
          <div class="menu__desc">Sign in to your account</div>
        </div>
      </div>

      <div class="menu__item" data-choice="3">
        <div class="menu__num">3</div>
        <div class="menu__text">
          <div class="menu__label">Exit</div>
          <div class="menu__desc">Close the program</div>
        </div>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="choiceInput">Or type a choice (1–3)</label>
      <input
        class="field__input"
        type="text"
        id="choiceInput"
        placeholder="Enter 1, 2 or 3"
        autocomplete="off"
      >
      <div class="field__error" id="choiceError"></div>
    </div>

    <button class="btn" id="submitBtn" type="button">Submit</button>
  </div>

</body>
</html>
